# Stimma — egen vhost med public/ som dokumentrot.
# Skapad 2026-08-17. Ersätter php:apache-avbildens 000-default.conf, som har
# DocumentRoot hårdkodad till /var/www/html (APACHE_DOCUMENT_ROOT-variabeln i
# docker-compose används inte av avbilden).
#
# FollowSymLinks är NÖDVÄNDIG: public/include, public/lib och
# public/allowed_domains.txt är symlänkar ut ur dokumentroten.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
