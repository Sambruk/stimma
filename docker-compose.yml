version: '3.8'

services:
  web:
    image: php:8.2-apache
    restart: always
    ports:
      - "172.17.0.1:13050:80"
    volumes:
      - /opt/app/stimma:/var/www/html
      - /opt/app/stimma/upload:/var/www/html/upload
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    labels:
      # Schemaläggning via Ofelia (scheduler-container nedan)
      ofelia.enabled: "true"
      # Stegvisa lektioner: varje timme — skickar nya-lektions-mail och påminnelser
      ofelia.job-exec.stimma-sequential-notifications.schedule: "@every 1h"
      ofelia.job-exec.stimma-sequential-notifications.command: "php /var/www/html/cron/send_sequential_notifications.php"
      # Stegvisa kurs-starter: kl 08:00 varje dag
      ofelia.job-exec.stimma-sequential-starts.schedule: "0 0 8 * * *"
      ofelia.job-exec.stimma-sequential-starts.command: "php /var/www/html/cron/process_sequential_starts.php"
      # Allmänna påminnelser (icke-stegvisa kurser): kl 09:00 varje dag
      ofelia.job-exec.stimma-reminders.schedule: "0 0 9 * * *"
      ofelia.job-exec.stimma-reminders.command: "php /var/www/html/cron/send_reminders.php"
      # Månatlig token-påfyllning: kl 00:05 den 1:a varje månad
      ofelia.job-exec.stimma-token-refill.schedule: "0 5 0 1 * *"
      ofelia.job-exec.stimma-token-refill.command: "php /var/www/html/cron/monthly_token_refill.php"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        apt-get update && apt-get install -y libzip-dev &&
        docker-php-ext-install pdo pdo_mysql mysqli zip &&
        a2enmod rewrite &&
        echo 'ServerName localhost' >> /etc/apache2/apache2.conf &&
        echo 'upload_max_filesize = 105M' > /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'post_max_size = 110M' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'max_file_uploads = 20' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'max_execution_time = 300' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'max_input_time = 300' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'display_errors = Off' > /usr/local/etc/php/conf.d/errors.ini &&
        echo 'display_startup_errors = Off' >> /usr/local/etc/php/conf.d/errors.ini &&
        echo 'log_errors = On' >> /usr/local/etc/php/conf.d/errors.ini &&
        echo 'error_reporting = E_ALL & ~E_DEPRECATED' >> /usr/local/etc/php/conf.d/errors.ini &&
        echo 'expose_php = Off' >> /usr/local/etc/php/conf.d/errors.ini &&
        apache2-foreground
      "

  scheduler:
    # Ofelia — docker-native cron som läser labels från web-containern.
    # Ingen host-cron behövs.
    #
    # Pinnad till digest (2026-08-13) istället för :latest. Ofelia har åtkomst
    # till docker-socketen och är därmed stackens känsligaste container — en
    # flytande tagg innebär att en ny image kan dras in oavsiktligt vid nästa
    # pull. Uppdatera medvetet: kontrollera uppströms, byt digest, testa.
    # Digesten nedan motsvarar den image som byggdes 2026-04-11.
    image: mcuadros/ofelia@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    restart: always
    depends_on:
      - web
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: "true"

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/app/stimma/db:/var/lib/mysql
      - /opt/app/stimma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
