version: '3.8'

services:
  web:
    image: php:8.2.35-apache  # låst efter CERT-EU 2026-018; höj medvetet
    restart: always
    ports:
      - "172.17.0.1:13050:80"
    volumes:
      - /opt/app/stimma:/var/www/html
      - /opt/app/stimma/public/upload:/var/www/html/public/upload
      # Egen vhost: dokumentrot = public/. Avbildens 000-default.conf har
      # DocumentRoot hårdkodad, så APACHE_DOCUMENT_ROOT nedan har aldrig haft effekt.
      - /opt/app/stimma/config/vhost.conf:/etc/apache2/sites-enabled/000-default.conf:ro
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    labels:
      # Schemaläggning via Ofelia (scheduler-container nedan)
      ofelia.enabled: "true"
      # Stegvisa lektioner: varje timme — skickar nya-lektions-mail och påminnelser
      ofelia.job-exec.stimma-sequential-notifications.schedule: "@every 1h"
      ofelia.job-exec.stimma-sequential-notifications.command: "php /var/www/html/cron/send_sequential_notifications.php"
      # Stegvisa kurs-starter: kl 08:00 varje dag
      ofelia.job-exec.stimma-sequential-starts.schedule: "0 0 8 * * *"
      ofelia.job-exec.stimma-sequential-starts.command: "php /var/www/html/cron/process_sequential_starts.php"
      # Allmänna påminnelser (icke-stegvisa kurser): kl 09:00 varje dag
      ofelia.job-exec.stimma-reminders.schedule: "0 0 9 * * *"
      ofelia.job-exec.stimma-reminders.command: "php /var/www/html/cron/send_reminders.php"
      # Månatlig token-påfyllning: kl 00:05 den 1:a varje månad
      ofelia.job-exec.stimma-token-refill.schedule: "0 5 0 1 * *"
      ofelia.job-exec.stimma-token-refill.command: "php /var/www/html/cron/monthly_token_refill.php"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        apt-get update && apt-get install -y libzip-dev &&
        docker-php-ext-install pdo pdo_mysql mysqli zip &&
        a2enmod rewrite &&
        echo 'ServerName localhost' >> /etc/apache2/apache2.conf &&
        echo 'upload_max_filesize = 105M' > /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'post_max_size = 110M' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'max_file_uploads = 20' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'max_execution_time = 300' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'max_input_time = 300' >> /usr/local/etc/php/conf.d/uploads.ini &&
        echo 'display_errors = Off' > /usr/local/etc/php/conf.d/errors.ini &&
        echo 'display_startup_errors = Off' >> /usr/local/etc/php/conf.d/errors.ini &&
        echo 'log_errors = On' >> /usr/local/etc/php/conf.d/errors.ini &&
        echo 'error_reporting = E_ALL & ~E_DEPRECATED' >> /usr/local/etc/php/conf.d/errors.ini &&
        echo 'expose_php = Off' >> /usr/local/etc/php/conf.d/errors.ini &&
        apache2-foreground
      "

  scheduler:
    # Ofelia — docker-native cron som läser labels från web-containern.
    # Ingen host-cron behövs.
    #
    # Pinnad till digest (2026-08-13) istället för :latest. Ofelia har åtkomst
    # till docker-socketen och är därmed stackens känsligaste container — en
    # flytande tagg innebär att en ny image kan dras in oavsiktligt vid nästa
    # pull. Uppdatera medvetet: kontrollera uppströms, byt digest, testa.
    # Digesten nedan motsvarar den image som byggdes 2026-04-11.
    image: mcuadros/ofelia@sha256:efcbe2c5cf658a25de6443c1462d653f9cc03791d642e01fc6c638a00f97e492
    restart: always
    depends_on:
      - web
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      ofelia.enabled: "true"
      # E-postlarm var 10:e minut (2026-10-23), se cron/mail_health_alert.php.
      # Ligger här och inte på web så att den kunde läggas till utan att
      # webbcontainern behövde startas om.
      ofelia.job-exec.stimma-mail-larm.schedule: "@every 10m"
      ofelia.job-exec.stimma-mail-larm.container: "stimma-web-1"
      ofelia.job-exec.stimma-mail-larm.command: "php /var/www/html/cron/mail_health_alert.php"

  backup:
    # Nattlig backup (2026-10-06): databasdump + uppladdade filer, PUB-dokument
    # och konfiguration, krypterat till S3 med restic. Se backup/backup.sh.
    # Utan S3-nycklar i .env görs bara den lokala dumpen (backups/, 7 st).
    build: ./backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-}
      # Utgångsdatum för S3-nyckeln (ÅÅÅÅ-MM-DD) – påminnelse via larmet, se backup.sh (2026-11-11)
      BACKUP_S3_KEY_EXPIRES: ${BACKUP_S3_KEY_EXPIRES:-}
      BACKUP_ALERT_EMAIL: ${BACKUP_ALERT_EMAIL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      # Larmvägen (Postal) prövas först, se backup/larm.sh (2026-10-23)
      LARM_MAIL_HOST: ${LARM_MAIL_HOST:-}
      LARM_MAIL_PORT: ${LARM_MAIL_PORT:-25}
      LARM_MAIL_USERNAME: ${LARM_MAIL_USERNAME:-}
      LARM_MAIL_PASSWORD: ${LARM_MAIL_PASSWORD:-}
      LARM_MAIL_ENCRYPTION: ${LARM_MAIL_ENCRYPTION:-}
    volumes:
      - /opt/app/stimma/backups:/backup/local
      - /opt/app/stimma/public/upload:/data/upload:ro
      - /opt/app/stimma/pub_docs:/data/docs:ro
      - /opt/app/stimma/config:/data/config:ro
      - /opt/app/stimma/.env:/data/env/.env:ro
    labels:
      ofelia.enabled: "true"
      # Varje natt 02:30
      ofelia.job-exec.stimma-backup.schedule: "0 30 2 * * *"
      ofelia.job-exec.stimma-backup.command: "/usr/local/bin/backup.sh"
      # Återställningstest 04:00 den 1:a varje månad
      ofelia.job-exec.stimma-restore-test.schedule: "0 0 4 1 * *"
      ofelia.job-exec.stimma-restore-test.command: "/usr/local/bin/restore-test.sh"

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/app/stimma/db:/var/lib/mysql
      - /opt/app/stimma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
